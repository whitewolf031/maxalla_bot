  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mahalla_backend
    restart: always
    networks:
      - shared-db
    env_file:
      - .env
    ports:
      - "8005:8000"
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    command: >
      sh -c "/app/entrypoint.sh &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8005 --workers 3 --timeout 120 --access-logfile - --error-logfile -"

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: mahalla_bot
    restart: always
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./bot:/app

volumes:
#  postgres_data:
  backend_static:
  backend_media:

networks:
  shared-db:
    external: true
